name: Refresh CA Urgent Dogs Feed

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-dogs-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: pip install playwright

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Chromium system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Scrape Direct CA Municipal Shelters
        run: python fetch_dogs.py

      - name: Commit and push updated feed & SEO pages
        run: |
          git config user.name "urgentpaws-bot"
          git config user.email "actions@github.com"
          git add dogs.json sitemap.xml *.html
          if git diff --staged --quiet; then
            echo "No changes to dogs.json or SEO pages"
          else
            git commit -m "chore: refresh CA municipal shelter urgent dogs and SEO pages"
            git pull --rebase -X ours origin main
            git push
          fi
