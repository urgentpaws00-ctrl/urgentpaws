name: Generate UrgentPaws Reel

on:
  schedule:
    # Runs every Tuesday and Friday at 9:00 AM PT (16:00 UTC)
    - cron: "0 16 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Generate 9:16 Reel MP4 and Caption
        run: python generate_reel.py

      - name: Upload Reel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: urgentpaws-reel
          path: |
            latest_reel.mp4
            reel_caption.txt

      - name: Commit latest_reel.mp4 and reel_caption.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_reel.mp4 reel_caption.txt
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate UrgentPaws vertical Reel"
            git push
          fi
