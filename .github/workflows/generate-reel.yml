name: Generate UrgentPaws Reel

on:
  schedule:
    # Runs daily at 7:17 AM PST (15:17 UTC) to avoid top-of-the-hour GitHub cron drops
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urgentpaws-media-generation
  cancel-in-progress: false

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          playwright install-deps chromium

      - name: Generate 9:16 Reel MP4 and Caption
        run: python generate_reel.py

      - name: Upload Reel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: urgentpaws-reel
          path: |
            latest_reel.mp4
            reel_caption.txt
            reel_history.json

      - name: Commit latest_reel.mp4, reel_caption.txt, and reel_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_reel.mp4 reel_caption.txt reel_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate UrgentPaws vertical Reel"
            git pull --rebase origin main
            git push
          fi
