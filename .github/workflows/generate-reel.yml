name: Generate UrgentPaws Reel

on:
  schedule:
    # Runs daily at 7:00 AM PST (15:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Generate 9:16 Reel MP4 and Caption
        run: python generate_reel.py

      - name: Upload Reel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: urgentpaws-reel
          path: |
            latest_reel.mp4
            reel_caption.txt
            reel_history.json

      - name: Commit latest_reel.mp4, reel_caption.txt, and reel_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_reel.mp4 reel_caption.txt reel_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate UrgentPaws vertical Reel"
            git push
          fi
