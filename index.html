<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrgentPaws — California Urgent Shelter Dogs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 min-h-screen">
  <header class="bg-white border-b border-neutral-200 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3.5">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h1 class="text-xl font-bold tracking-tight">UrgentPaws</h1>
          <p class="text-xs text-neutral-600">
            California shelter dogs facing urgent deadlines—direct IDs &amp; shelter links.
          </p>
        </div>
        <span id="lastChecked" class="shrink-0 text-xs font-medium text-neutral-600 bg-neutral-100 px-2.5 py-1 rounded-full">
          Syncing…
        </span>
      </div>

      <!-- Quick Role Pills -->
      <div class="flex gap-1.5 overflow-x-auto pt-3 pb-1" role="group" aria-label="Filter by action">
        <button type="button" data-role="ALL" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-900 text-white shrink-0">
          All Urgent
        </button>
        <button type="button" data-role="Foster" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200 shrink-0">
          Foster Needed
        </button>
        <button type="button" data-role="Adopt" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200 shrink-0">
          Adoptable
        </button>
        <button type="button" data-role="Rescue" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200 shrink-0">
          Rescue Pull
        </button>
      </div>

      <!-- Search & Dropdown Filters -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2.5">
        <input
          id="searchInput"
          type="search"
          placeholder="Search Animal ID, name, breed, shelter…"
          aria-label="Search Animal ID, name, breed, or shelter"
          class="col-span-2 w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900"
        />

        <select id="countyFilter" aria-label="Filter by county" class="w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm">
          <option value="ALL">All CA Counties</option>
        </select>

        <select id="urgencyFilter" aria-label="Filter by urgency" class="w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm">
          <option value="ALL">All Urgency Types</option>
          <option value="Urgent / Deadline">Urgent / Deadline Only</option>
          <option value="Space">Space / Capacity</option>
          <option value="Medical">Medical</option>
          <option value="Behavior">Behavior / Rescue Only</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5">
    <div class="flex items-center justify-between gap-2 mb-3.5">
      <div id="countLabel" class="text-xs font-semibold uppercase tracking-wider text-neutral-500"></div>
      <button id="resetBtn" type="button" class="text-xs font-medium text-neutral-600 underline hover:text-neutral-950">
        Reset filters
      </button>
    </div>

    <div id="dogGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </main>

  <script>
    let allDogs = [];
    let selectedRole = 'ALL';

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '#';
      } catch {
        return '#';
      }
    }

    function formatLocation(dog) {
      const cityState = [dog.city, dog.state].filter(Boolean).join(', ');
      return dog.county ? `${cityState} (${dog.county} Co.)`.replace(/^ \(/, '(') : cityState;
    }

    function formatAge(isoStr) {
      if (!isoStr) return '';
      const ts = new Date(isoStr).getTime();
      if (Number.isNaN(ts)) return '';
      const diffHrs = Math.max(0, Math.floor((Date.now() - ts) / 3600000));
      if (diffHrs < 1) return 'Verified just now';
      if (diffHrs < 24) return `Verified ${diffHrs}h ago`;
      const days = Math.floor(diffHrs / 24);
      return `Updated ${days}d ago`;
    }

    async function copyAnimalId(btn, idText) {
      try {
        await navigator.clipboard.writeText(idText);
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch {
        btn.textContent = idText;
      }
    }

    async function loadDogs() {
      const grid = document.getElementById('dogGrid');
      try {
        const res = await fetch(`https://raw.githubusercontent.com/urgentpaws00-ctrl/urgentpaws/main/dogs.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Feed fetch failed');
        allDogs = await res.json();
      } catch {
        grid.innerHTML = `<div class="sm:col-span-2 rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-600">Unable to load urgent listings right now. Check back shortly.</div>`;
        document.getElementById('lastChecked').textContent = 'Sync pending';
        return;
      }

      const latest = allDogs
        .map(d => d.last_checked)
        .filter(Boolean)
        .sort()
        .pop();

      document.getElementById('lastChecked').textContent = latest
        ? `Updated ${new Date(latest).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`
        : 'Live feed';

      const counties = [...new Set(allDogs.map(d => d.county).filter(Boolean))].sort();
      const countySelect = document.getElementById('countyFilter');
      counties.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c} County`;
        countySelect.appendChild(opt);
      });

      render();
    }

    function render() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const county = document.getElementById('countyFilter').value;
      const urgency = document.getElementById('urgencyFilter').value;

      const filtered = allDogs.filter(d => {
        const matchesRole =
          selectedRole === 'ALL' ||
          (d.needs_type || '').toLowerCase().includes(selectedRole.toLowerCase());

        const matchesCounty = county === 'ALL' || d.county === county;

        const urgencyBlob = `${d.urgency_type || ''} ${d.deadline_or_urgency || ''}`.toLowerCase();
        const matchesUrgency = urgency === 'ALL' || urgencyBlob.includes(urgency.toLowerCase());

        const searchBlob = `${d.animal_id || ''} ${d.name || ''} ${d.breed || ''} ${d.shelter || ''} ${d.city || ''} ${d.county || ''}`.toLowerCase();
        const matchesQuery = !query || searchBlob.includes(query);

        return matchesRole && matchesCounty && matchesUrgency && matchesQuery;
      });

      document.getElementById('countLabel').textContent =
        `${filtered.length} ${filtered.length === 1 ? 'dog' : 'dogs'} shown`;

      const grid = document.getElementById('dogGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="sm:col-span-2 rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-600">No urgent dogs match those filters right now.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(d => {
        const name = escapeHtml(d.name || 'Unnamed');
        const animalId = escapeHtml(d.animal_id || '');
        const breed = escapeHtml(d.breed || '');
        const shelter = escapeHtml(d.shelter || 'California Shelter');
        const locStr = escapeHtml(formatLocation(d));
        const ageLabel = escapeHtml(formatAge(d.updated_at || d.last_checked));
        const deadline = escapeHtml(d.deadline_or_urgency || 'Urgent');
        const isDeadline = deadline.toLowerCase().includes('urgent') || deadline.toLowerCase().includes('deadline');
        const badgeStyle = isDeadline
          ? 'bg-red-100 text-red-800'
          : 'bg-amber-100 text-amber-900';

        const urgencyType = escapeHtml(d.urgency_type || '');
        const needsType = escapeHtml(d.needs_type || '');
        const transportNote = escapeHtml(d.transport_note || '');
        const details = escapeHtml([breed, d.age, d.size].filter(Boolean).join(' · '));
        const photoUrl = safeUrl(d.photo_url);
        const listingUrl = safeUrl(d.listing_url);

        return `
          <article class="rounded-xl border border-neutral-200 bg-white overflow-hidden flex flex-col justify-between shadow-2xs">
            <div>
              ${d.photo_url ? `<img src="${photoUrl}" alt="${name}" loading="lazy" class="w-full h-56 object-cover bg-neutral-200" />` : ''}
              <div class="p-4">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h2 class="text-lg font-bold leading-snug">${name}</h2>
                    ${details ? `<p class="text-xs font-medium text-neutral-500 mt-0.5">${details}</p>` : ''}
                  </div>
                  <span class="shrink-0 rounded-full ${badgeStyle} px-2.5 py-1 text-xs font-semibold">
                    ${deadline}
                  </span>
                </div>

                ${animalId ? `
                  <div class="mt-2.5 flex items-center gap-2">
                    <span class="text-xs font-mono font-semibold bg-neutral-100 text-neutral-800 px-2 py-0.5 rounded">
                      ID: ${animalId}
                    </span>
                    <button
                      type="button"
                      onclick="copyAnimalId(this, '${animalId}')"
                      class="text-xs font-medium text-neutral-600 underline hover:text-neutral-950"
                    >
                      Copy ID
                    </button>
                  </div>
                ` : ''}

                <p class="text-sm font-medium text-neutral-800 mt-2.5">${shelter}</p>
                ${locStr ? `<p class="text-xs text-neutral-500">${locStr}</p>` : ''}
                ${ageLabel ? `<p class="text-xs text-neutral-400 mt-0.5">${ageLabel}</p>` : ''}

                <div class="flex flex-wrap gap-1.5 mt-3">
                  ${urgencyType ? `<span class="rounded-md bg-amber-50 border border-amber-200 text-amber-900 px-2 py-0.5 text-xs font-medium">${urgencyType}</span>` : ''}
                  ${needsType ? `<span class="rounded-md bg-neutral-100 text-neutral-800 px-2 py-0.5 text-xs font-medium">${needsType}</span>` : ''}
                  ${transportNote ? `<span class="rounded-md bg-sky-50 border border-sky-200 text-sky-900 px-2 py-0.5 text-xs font-medium">${transportNote}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="px-4 pb-4 pt-1">
              <a href="${listingUrl}" target="_blank" rel="noopener noreferrer"
                 class="block w-full text-center rounded-lg bg-neutral-900 text-white text-sm font-semibold py-2.5 hover:bg-neutral-800">
                View Shelter / Rescue Listing →
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('.role-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedRole = btn.dataset.role;
        document.querySelectorAll('.role-pill').forEach(b => {
          const active = b === btn;
          b.className = `role-pill px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 ${
            active ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
          }`;
        });
        render();
      });
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('countyFilter').addEventListener('change', render);
    document.getElementById('urgencyFilter').addEventListener('change', render);
    document.getElementById('resetBtn').addEventListener('click', () => {
      selectedRole = 'ALL';
      document.querySelectorAll('.role-pill').forEach((b, i) => {
        b.className = `role-pill px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 ${
          i === 0 ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
        }`;
      });
      document.getElementById('searchInput').value = '';
      document.getElementById('countyFilter').value = 'ALL';
      document.getElementById('urgencyFilter').value = 'ALL';
      render();
    });

    loadDogs();
  </script>
</body>
</html>
