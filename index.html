<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrgentPaws | Urgent Municipal Shelter Dogs</title>
  <meta name="description" content="Live list of urgent municipal shelter dogs facing deadlines, medical emergencies, and rescue-only holds, with direct Animal IDs and official shelter links." />
  <link rel="canonical" href="https://www.urgentpaws.org/" />
  <link rel="icon" href="logo.png" type="image/png" />
  <meta property="og:title" content="UrgentPaws | Urgent Municipal Shelter Dogs" />
  <meta property="og:description" content="Find urgent municipal shelter dogs with direct Animal IDs and official shelter links." />
  <meta property="og:url" content="https://www.urgentpaws.org/" />
  <meta property="og:image" content="https://www.urgentpaws.org/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 min-h-screen flex flex-col">
  <header class="bg-white border-b border-neutral-200 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3.5">
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <a href="./" class="flex items-center gap-2.5">
          <img src="logo.png" alt="UrgentPaws logo" class="w-8 h-8 rounded-lg object-contain" onerror="this.style.display='none'" />
          <div>
            <h1 class="text-xl font-bold tracking-tight leading-none">UrgentPaws</h1>
            <p class="text-xs text-neutral-600 mt-0.5">
              Municipal shelter dogs facing urgent deadlines, with direct IDs and shelter links.
            </p>
          </div>
        </a>

        <div class="flex flex-wrap items-center gap-3">
          <nav aria-label="Primary navigation" class="flex items-center gap-3 text-xs font-semibold text-neutral-700">
            <a href="about-urgent-paws" class="hover:text-neutral-950">About</a>
            <a href="for-shelters" class="hover:text-neutral-950">For Shelters</a>
            <a href="blog" class="hover:text-neutral-950">Guide</a>
            <a href="contact-us" class="hover:text-neutral-950">Contact</a>
          </nav>
          <span id="lastChecked" class="shrink-0 text-xs font-medium text-neutral-600 bg-neutral-100 px-2.5 py-1 rounded-full">
            Syncing...
          </span>
        </div>
      </div>

      <!-- Quick Role Pills -->
      <div class="flex flex-wrap gap-1.5 pt-3 pb-1" role="group" aria-label="Filter by action">
        <button type="button" data-role="ALL" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-900 text-white">
          All Urgent
        </button>
        <button type="button" data-role="RESCUE_ONLY" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200">
          Rescue Only
        </button>
        <button type="button" data-role="FOSTER" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200">
          Foster Needed
        </button>
        <button type="button" data-role="ADOPT" class="role-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200">
          Adoptable
        </button>
      </div>

      <!-- Search and Dropdown Filters -->
      <div id="filterBar" class="grid grid-cols-1 sm:grid-cols-12 gap-2 mt-2.5">
        <input
          id="searchInput"
          type="search"
          placeholder="Search ID, name, breed, shelter..."
          aria-label="Search Animal ID, name, breed, or shelter"
          class="sm:col-span-4 w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900"
        />

        <select id="stateFilter" aria-label="Filter by state" class="hidden sm:col-span-2 w-full rounded-lg border border-neutral-300 bg-white px-2.5 py-2 text-sm truncate">
          <option value="ALL">All States</option>
        </select>

        <select id="countyFilter" aria-label="Filter by county" class="sm:col-span-2 w-full rounded-lg border border-neutral-300 bg-white px-2.5 py-2 text-sm truncate">
          <option value="ALL">All Counties</option>
        </select>

        <select id="shelterFilter" aria-label="Filter by shelter" class="sm:col-span-3 w-full rounded-lg border border-neutral-300 bg-white px-2.5 py-2 text-sm truncate">
          <option value="ALL">All Shelters</option>
        </select>

        <select id="urgencyFilter" aria-label="Filter by urgency" class="sm:col-span-3 w-full rounded-lg border border-neutral-300 bg-white px-2.5 py-2 text-sm truncate">
          <option value="ALL">All Urgency Types</option>
          <option value="deadline">Urgent / Deadline Only</option>
          <option value="behavior">Behavior / Kennel Stress</option>
          <option value="medical">Medical Alert</option>
          <option value="capacity">Space / Capacity / High-Risk</option>
          <option value="rescue">Rescue Pull Only</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full">
    <div class="flex items-center justify-between gap-2 mb-3.5">
      <div class="flex flex-wrap items-center gap-2">
        <div id="countLabel" class="text-xs font-semibold uppercase tracking-wider text-neutral-500"></div>
        <a
          id="shelterGuideLink"
          href="#"
          class="hidden text-xs font-semibold text-neutral-800 bg-white border border-neutral-300 rounded-full px-2.5 py-0.5 hover:bg-neutral-900 hover:text-white transition"
        ></a>
      </div>
      <button id="resetBtn" type="button" class="text-xs font-medium text-neutral-600 underline hover:text-neutral-950">
        Reset filters
      </button>
    </div>

    <div id="dogGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </main>

  <footer class="bg-white border-t border-neutral-200 mt-10">
    <div class="max-w-4xl mx-auto px-4 py-5 space-y-4 text-xs text-neutral-500">
      <nav aria-label="Shelter Urgent Lists" class="border-b border-neutral-200 pb-4">
        <p class="font-semibold text-neutral-700 mb-1.5">Browse Urgent Dogs by Shelter:</p>
        <div id="footerShelterLinks" class="flex flex-wrap gap-x-3 gap-y-1.5 text-neutral-600"></div>
      </nav>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <span>&copy; 2026 UrgentPaws | Urgent Municipal Shelter Dog Directory</span>
        <div class="flex flex-wrap gap-4">
          <a href="./" class="hover:text-neutral-900">Home</a>
          <a href="about-urgent-paws" class="hover:text-neutral-900">About</a>
          <a href="for-shelters" class="hover:text-neutral-900">For Shelters</a>
          <a href="blog" class="hover:text-neutral-900">Guide</a>
          <a href="contact-us" class="hover:text-neutral-900">Contact Us</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    let allDogs = [];
    let allShelters = [];
    let sheltersBySlug = {};
    let selectedRole = 'ALL';

    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/urgentpaws00-ctrl/urgentpaws/main';

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '#';
      } catch {
        return '#';
      }
    }

    function formatLocation(dog) {
      const cityState = [dog.city, dog.state].filter(Boolean).join(', ');
      return dog.county ? `${cityState} (${dog.county} Co.)`.replace(/^ \(/, '(') : cityState;
    }

    function formatAge(isoStr) {
      if (!isoStr) return '';
      const ts = new Date(isoStr).getTime();
      if (Number.isNaN(ts)) return '';
      const diffHrs = Math.max(0, Math.floor((Date.now() - ts) / 3600000));
      if (diffHrs < 1) return 'Verified just now';
      if (diffHrs < 24) return `Verified ${diffHrs}h ago`;
      const days = Math.floor(diffHrs / 24);
      return `Updated ${days}d ago`;
    }

    function isDeadlinePassed(dog) {
      const deadlineMatch = `${dog.deadline_or_urgency || ''} ${dog.urgency_type || ''}`.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
      if (!deadlineMatch) return false;
      const yr = deadlineMatch[3].length === 2 ? `20${deadlineMatch[3]}` : deadlineMatch[3];
      const dlIso = `${yr}-${deadlineMatch[1].padStart(2, '0')}-${deadlineMatch[2].padStart(2, '0')}`;
      const tz = sheltersBySlug[dog.shelter_slug]?.timezone || 'America/Los_Angeles';
      try {
        const todayInShelterTz = new Date().toLocaleDateString('en-CA', { timeZone: tz });
        return dlIso < todayInShelterTz;
      } catch {
        return dlIso < new Date().toLocaleDateString('en-CA');
      }
    }

    function isRescueOnlyDog(dog) {
      const needs = (dog.needs_type || '').toLowerCase();
      const blob = `${needs} ${dog.urgency_type || ''} ${dog.deadline_or_urgency || ''}`.toLowerCase();
      return needs.includes('rescue pull only') || /\brescue\s*only\b/.test(blob);
    }

    function matchesRole(dog, role) {
      if (!role || role === 'ALL') return true;
      const needs = (dog.needs_type || '').toLowerCase();
      const rescueOnly = isRescueOnlyDog(dog);

      if (role === 'RESCUE_ONLY') return rescueOnly;
      if (role === 'FOSTER') {
        if (rescueOnly) return false;
        const fosterBlob = `${needs} ${dog.urgency_type || ''} ${dog.deadline_or_urgency || ''}`.toLowerCase();
        return /\bfoster\b/.test(fosterBlob);
      }
      if (role === 'ADOPT') {
        if (rescueOnly) return false;
        return /\badopt\b/.test(needs);
      }
      return true;
    }

    function matchesUrgency(dog, filterVal) {
      if (!filterVal || filterVal === 'ALL') return true;
      const blob = `${dog.deadline_or_urgency || ''} ${dog.urgency_type || ''} ${dog.transport_note || ''}`.toLowerCase();

      if (filterVal === 'deadline') {
        return /euthanasia|final call|deadline|out of time|needs rescue final|red list/.test(blob);
      }
      if (filterVal === 'behavior') {
        return /\b(u-behavior|behavior|behaviour|fearful|reactive|barrier|kennel stress|escalating stress|handling|selective|guarding)\b/.test(blob);
      }
      if (filterVal === 'medical') {
        return /\b(medical|orange|blue|parvo|injured|hospice|uri|u-medical)\b/.test(blob);
      }
      if (filterVal === 'capacity') {
        return /\b(space|capacity|greatest risk|red status|u-los|long-stay)\b/.test(blob);
      }
      if (filterVal === 'rescue') {
        return isRescueOnlyDog(dog);
      }
      return blob.includes(filterVal.toLowerCase());
    }

    function dogMatchesShelterSlug(dog, slug) {
      if (!slug || slug === 'ALL') return true;
      if (dog.shelter_slug) return dog.shelter_slug === slug;
      const cfg = sheltersBySlug[slug];
      return cfg ? (dog.county || '').toLowerCase() === (cfg.county || '').toLowerCase() : false;
    }

    function renderFooterShelters() {
      const footerContainer = document.getElementById('footerShelterLinks');
      footerContainer.innerHTML = allShelters.map(s =>
        `<a href="${escapeHtml(s.slug)}" class="hover:text-neutral-950 underline">${escapeHtml(s.name)}</a>`
      ).join('<span>&middot;</span>');
    }

    function syncCountyOptions() {
      const selectedState = document.getElementById('stateFilter').value;
      const countySelect = document.getElementById('countyFilter');
      const prevCounty = countySelect.value;

      const relevantShelters = allShelters.filter(s => selectedState === 'ALL' || s.state === selectedState);
      const counties = [...new Set(relevantShelters.map(s => s.county).filter(Boolean))].sort();

      countySelect.innerHTML = '<option value="ALL">All Counties</option>';
      counties.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c} County`;
        countySelect.appendChild(opt);
      });

      countySelect.value = counties.includes(prevCounty) ? prevCounty : 'ALL';
    }

    function syncShelterOptions() {
      const selectedState = document.getElementById('stateFilter').value;
      const selectedCounty = document.getElementById('countyFilter').value;
      const shelterSelect = document.getElementById('shelterFilter');
      const prevShelter = shelterSelect.value;

      const activeDogs = allDogs.filter(d => !isDeadlinePassed(d));
      const candidateShelters = allShelters.filter(s => {
        if (selectedState !== 'ALL' && s.state !== selectedState) return false;
        if (selectedCounty !== 'ALL' && s.county !== selectedCounty) return false;
        return true;
      });

      shelterSelect.innerHTML = '<option value="ALL">All Shelters</option>';

      if (selectedCounty !== 'ALL') {
        candidateShelters.forEach(s => {
          const count = activeDogs.filter(d => dogMatchesShelterSlug(d, s.slug)).length;
          const opt = document.createElement('option');
          opt.value = s.slug;
          opt.textContent = `${s.short_name || s.name} (${count})`;
          shelterSelect.appendChild(opt);
        });
      } else {
        const byCounty = new Map();
        candidateShelters.forEach(s => {
          const groupLabel = s.county ? `${s.county} County` : 'Other';
          if (!byCounty.has(groupLabel)) byCounty.set(groupLabel, []);
          byCounty.get(groupLabel).push(s);
        });

        [...byCounty.keys()].sort().forEach(groupLabel => {
          const groupEl = document.createElement('optgroup');
          groupEl.label = groupLabel;
          byCounty.get(groupLabel).forEach(s => {
            const count = activeDogs.filter(d => dogMatchesShelterSlug(d, s.slug)).length;
            const opt = document.createElement('option');
            opt.value = s.slug;
            opt.textContent = `${s.short_name || s.name} (${count})`;
            groupEl.appendChild(opt);
          });
          shelterSelect.appendChild(groupEl);
        });
      }

      const validSlugs = new Set(candidateShelters.map(s => s.slug));
      shelterSelect.value = validSlugs.has(prevShelter) ? prevShelter : 'ALL';
    }

    async function copyAnimalId(btn, idText) {
      try {
        await navigator.clipboard.writeText(idText);
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch {
        btn.textContent = idText;
      }
    }

    async function shareDogById(btn, dogUid) {
      const dog = allDogs.find(d => (d.id || d.animal_id) === dogUid);
      const name = dog?.name || 'Urgent Shelter Dog';
      const aid = dog?.animal_id ? ` (#${dog.animal_id})` : '';
      const shelter = dog?.shelter || 'Municipal Shelter';
      const deadline = dog?.deadline_or_urgency ? ` - ${dog.deadline_or_urgency}` : '';
      const shareUrl = dog?.id
        ? `${window.location.origin}/?dog=${encodeURIComponent(dog.id)}`
        : window.location.href;
      const shareText = `URGENT: ${name}${aid} at ${shelter}${deadline}. View live status & shelter link:`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: `${name} - UrgentPaws`,
            text: shareText,
            url: shareUrl,
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      const fullCopy = `${shareText} ${shareUrl}`;
      try {
        await navigator.clipboard.writeText(fullCopy);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = fullCopy;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }

      const orig = btn.textContent;
      btn.textContent = 'Copied Link!';
      btn.classList.remove('bg-white', 'text-neutral-900', 'border-neutral-300');
      btn.classList.add('bg-green-600', 'text-white', 'border-green-600');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('bg-green-600', 'text-white', 'border-green-600');
        btn.classList.add('bg-white', 'text-neutral-900', 'border-neutral-300');
      }, 1800);
    }

    async function loadDogs() {
      const grid = document.getElementById('dogGrid');
      const cacheBust = Date.now();

      try {
        const [dogsRes, sheltersRes] = await Promise.all([
          fetch(`${REPO_RAW_BASE}/dogs.json?t=${cacheBust}`),
          fetch(`${REPO_RAW_BASE}/shelters.json?t=${cacheBust}`).catch(() => null),
        ]);
        if (!dogsRes.ok) throw new Error('Feed fetch failed');
        allDogs = await dogsRes.json();

        if (sheltersRes && sheltersRes.ok) {
          allShelters = await sheltersRes.json();
        } else {
          const seen = new Map();
          allDogs.forEach(d => {
            const key = d.shelter_slug || d.county || d.shelter;
            if (key && !seen.has(key)) {
              seen.set(key, {
                slug: d.shelter_slug || '',
                name: d.shelter || key,
                short_name: d.county || d.shelter || key,
                county: d.county || '',
                state: d.state || 'CA',
                timezone: 'America/Los_Angeles',
              });
            }
          });
          allShelters = [...seen.values()];
        }
        sheltersBySlug = Object.fromEntries(allShelters.map(s => [s.slug, s]));
      } catch {
        grid.innerHTML = `<div class="sm:col-span-2 rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-600">Unable to load urgent listings right now. Check back shortly.</div>`;
        document.getElementById('lastChecked').textContent = 'Sync pending';
        return;
      }

      const latest = allDogs
        .map(d => d.last_checked)
        .filter(Boolean)
        .sort()
        .pop();

      document.getElementById('lastChecked').textContent = latest
        ? `Updated ${new Date(latest).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`
        : 'Live feed';

      const states = [...new Set(allShelters.map(s => s.state).filter(Boolean))].sort();
      const stateSelect = document.getElementById('stateFilter');
      const searchInput = document.getElementById('searchInput');
      if (states.length > 1) {
        states.forEach(st => {
          const opt = document.createElement('option');
          opt.value = st;
          opt.textContent = st;
          stateSelect.appendChild(opt);
        });
        stateSelect.classList.remove('hidden');
        searchInput.classList.remove('sm:col-span-4');
        searchInput.classList.add('sm:col-span-2');
      }

      syncCountyOptions();
      syncShelterOptions();
      renderFooterShelters();

      const sharedDogParam = new URLSearchParams(window.location.search).get('dog');
      if (sharedDogParam) {
        const target = allDogs.find(d => d.id === sharedDogParam);
        if (target && target.animal_id) {
          document.getElementById('searchInput').value = target.animal_id;
        }
      }

      render();
    }

    function render() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const state = document.getElementById('stateFilter').value;
      const county = document.getElementById('countyFilter').value;
      const shelterSlug = document.getElementById('shelterFilter').value;
      const urgency = document.getElementById('urgencyFilter').value;

      const filtered = allDogs.filter(d => {
        if (isDeadlinePassed(d)) return false;

        const isRoleMatch = matchesRole(d, selectedRole);
        const matchesState = state === 'ALL' || d.state === state;
        const matchesCounty = county === 'ALL' || d.county === county;
        const matchesShelter = dogMatchesShelterSlug(d, shelterSlug);
        const isUrgencyMatch = matchesUrgency(d, urgency);

        const searchBlob = `${d.animal_id || ''} ${d.name || ''} ${d.breed || ''} ${d.shelter || ''} ${d.city || ''} ${d.county || ''} ${d.state || ''}`.toLowerCase();
        const matchesQuery = !query || searchBlob.includes(query);

        return isRoleMatch && matchesState && matchesCounty && matchesShelter && isUrgencyMatch && matchesQuery;
      });

      const activeShelterObj = shelterSlug !== 'ALL' ? sheltersBySlug[shelterSlug] : null;
      const scopeSuffix = activeShelterObj
        ? ` · ${activeShelterObj.short_name || activeShelterObj.name}`
        : (county !== 'ALL' ? ` · ${county} County` : '');
      document.getElementById('countLabel').textContent =
        `${filtered.length} ${filtered.length === 1 ? 'dog' : 'dogs'} shown${scopeSuffix}`;

      const guideLink = document.getElementById('shelterGuideLink');
      if (activeShelterObj && activeShelterObj.slug) {
        guideLink.href = activeShelterObj.slug;
        guideLink.textContent = `${activeShelterObj.short_name || activeShelterObj.name} Rescue & Address Info →`;
        guideLink.classList.remove('hidden');
      } else {
        guideLink.classList.add('hidden');
      }

      const grid = document.getElementById('dogGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="sm:col-span-2 rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-600">No urgent dogs match those filters right now.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(d => {
        const dogUid = escapeHtml(d.id || d.animal_id || '');
        const name = escapeHtml(d.name || 'Unnamed');
        const animalId = escapeHtml(d.animal_id || '');
        const breed = escapeHtml(d.breed || '');
        const shelter = escapeHtml(d.shelter || 'Municipal Shelter');
        const locStr = escapeHtml(formatLocation(d));
        const ageLabel = escapeHtml(formatAge(d.updated_at || d.last_checked));
        const rawDeadline = d.deadline_or_urgency || 'Urgent';
        const deadline = escapeHtml(rawDeadline);
        const isDeadline = /euthanasia|final call|deadline|out of time|needs rescue final|red list/i.test(rawDeadline);
        const badgeStyle = isDeadline
          ? 'bg-red-100 text-red-800'
          : 'bg-amber-100 text-amber-900';

        const urgencyType = escapeHtml(d.urgency_type || '');
        const needsType = escapeHtml(d.needs_type || '');
        const transportNote = escapeHtml(d.transport_note || '');
        const details = escapeHtml([breed, d.age, d.size].filter(Boolean).join(' | '));
        const photoUrl = safeUrl(d.photo_url);
        const listingUrl = safeUrl(d.listing_url);

        return `
          <article class="rounded-xl border border-neutral-200 bg-white overflow-hidden flex flex-col justify-between shadow-2xs">
            <div>
              ${d.photo_url ? `<img src="${photoUrl}" alt="${name}" loading="lazy" class="w-full aspect-[4/3] object-cover object-[center_20%] bg-neutral-200" />` : ''}
              <div class="p-4">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h2 class="text-lg font-bold leading-snug">${name}</h2>
                    ${details ? `<p class="text-xs font-medium text-neutral-500 mt-0.5">${details}</p>` : ''}
                  </div>
                  <span class="shrink-0 rounded-full ${badgeStyle} px-2.5 py-1 text-xs font-semibold">
                    ${deadline}
                  </span>
                </div>

                ${animalId ? `
                  <div class="mt-2.5 flex items-center gap-2">
                    <span class="text-xs font-mono font-semibold bg-neutral-100 text-neutral-800 px-2 py-0.5 rounded">
                      ID: ${animalId}
                    </span>
                    <button
                      type="button"
                      onclick="copyAnimalId(this, '${animalId}')"
                      class="text-xs font-medium text-neutral-600 underline hover:text-neutral-950"
                    >
                      Copy ID
                    </button>
                  </div>
                ` : ''}

                <p class="text-sm font-medium text-neutral-800 mt-2.5">${shelter}</p>
                ${locStr ? `<p class="text-xs text-neutral-500">${locStr}</p>` : ''}
                ${ageLabel ? `<p class="text-xs text-neutral-400 mt-0.5">${ageLabel}</p>` : ''}

                <div class="flex flex-wrap gap-1.5 mt-3">
                  ${urgencyType ? `<span class="rounded-md bg-amber-50 border border-amber-200 text-amber-900 px-2 py-0.5 text-xs font-medium">${urgencyType}</span>` : ''}
                  ${needsType ? `<span class="rounded-md bg-neutral-100 text-neutral-800 px-2 py-0.5 text-xs font-medium">${needsType}</span>` : ''}
                  ${transportNote ? `<span class="rounded-md bg-sky-50 border border-sky-200 text-sky-900 px-2 py-0.5 text-xs font-medium">${transportNote}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="px-4 pb-4 pt-1 flex flex-col gap-2">
              <a href="${listingUrl}" target="_blank" rel="noopener noreferrer"
                 class="block w-full text-center rounded-full bg-neutral-900 text-white text-xs font-semibold py-2.5 px-4 hover:bg-neutral-800">
                View Shelter / Rescue Listing
              </a>
              <button type="button"
                      onclick="shareDogById(this, '${dogUid}')"
                      class="w-full text-center rounded-full bg-white text-neutral-900 border border-neutral-300 text-xs font-semibold py-2 px-4 hover:bg-neutral-100 transition">
                Share Dog
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('.role-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedRole = btn.dataset.role;
        document.querySelectorAll('.role-pill').forEach(b => {
          const active = b === btn;
          b.className = `role-pill px-3 py-1.5 rounded-full text-xs font-semibold ${
            active ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
          }`;
        });
        render();
      });
    });

    document.getElementById('stateFilter').addEventListener('change', () => {
      syncCountyOptions();
      syncShelterOptions();
      render();
    });

    document.getElementById('countyFilter').addEventListener('change', () => {
      document.getElementById('shelterFilter').value = 'ALL';
      syncShelterOptions();
      render();
    });

    document.getElementById('shelterFilter').addEventListener('change', () => {
      const slug = document.getElementById('shelterFilter').value;
      if (slug !== 'ALL') {
        document.getElementById('countyFilter').value = 'ALL';
        syncShelterOptions();
        document.getElementById('shelterFilter').value = slug;
      }
      render();
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('urgencyFilter').addEventListener('change', render);
    document.getElementById('resetBtn').addEventListener('click', () => {
      selectedRole = 'ALL';
      document.querySelectorAll('.role-pill').forEach((b, i) => {
        b.className = `role-pill px-3 py-1.5 rounded-full text-xs font-semibold ${
          i === 0 ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
        }`;
      });
      document.getElementById('searchInput').value = '';
      document.getElementById('stateFilter').value = 'ALL';
      syncCountyOptions();
      syncShelterOptions();
      document.getElementById('urgencyFilter').value = 'ALL';
      render();
    });

    loadDogs();
  </script>
</body>
</html>
